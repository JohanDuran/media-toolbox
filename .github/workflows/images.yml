# Builds the toolbox images and publishes them to GitHub Container Registry, so users can
# `docker compose pull` instead of building ~10 GB themselves.
#   - on a version tag (v0.1.0): tags <version> and latest
#   - by hand (Actions → images → Run workflow): tags the branch name
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway,      context: .,       file: gateway/Dockerfile,        target: "" }
          - { name: render,       context: workers, file: workers/Dockerfile.render, target: "" }
          - { name: whisperx,     context: workers, file: workers/Dockerfile.gpu,    target: whisperx }
          - { name: stable-audio, context: workers, file: workers/Dockerfile.gpu,    target: stable-audio }
          - { name: tts,          context: workers, file: workers/Dockerfile.gpu,    target: tts }
          - { name: vision,       context: workers, file: workers/Dockerfile.gpu,    target: vision }
          - { name: comfyui,      context: workers, file: workers/Dockerfile.gpu,    target: comfyui }
          - { name: image,        context: workers, file: workers/Dockerfile.image,  target: "" }
    steps:
      # The CUDA + torch images are bigger than a runner's free disk; drop preinstalled SDKs first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/media-toolbox-${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=min
