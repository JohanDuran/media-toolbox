<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<!-- Parallax shot from one still: a moving 2.5D camera, drawn from timeline time only.
     The render worker fills __W__/__H__/__DURATION__ and writes assets/params.js + the images.
     Modes:
       depth   one image displaced per pixel by its depth map in WebGL (default; needs the depth map)
       layers  background plate + subject cutout on two planes (one clean subject; needs the plate + cutout) -->
<script src="vendor/gsap.min.js"></script>
<script src="assets/params.js"></script>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
#parallax-root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
#parallax-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="parallax-root" data-composition-id="parallax" data-start="0" data-duration="__DURATION__"
     data-width="__W__" data-height="__H__">
  <canvas id="parallax-canvas" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="1"
          width="__W__" height="__H__"></canvas>
</div>
<script>
(function () {
  const P = window.PARALLAX;
  const W = P.width, H = P.height, D = P.duration, m = P.strength;
  const SHORT = Math.min(W, H);
  const canvas = document.getElementById("parallax-canvas");

  // Each move maps eased progress e (0..1) to a camera: zoom z, shift (sx, sy) as a fraction of the
  // frame's short side, depth zoom a (near grows more than far) and depth shift b (near slides more).
  const MOVES = {
    "push-in":   (e) => ({ z: 1 + 0.08 * m * e, sx: 0, sy: 0, a: 0.10 * m * e, b: 0 }),
    "pull-out":  (e) => ({ z: 1 + 0.08 * m * (1 - e), sx: 0, sy: 0, a: 0.10 * m * (1 - e), b: 0 }),
    "pan-left":  (e) => ({ z: 1, sx: 0.035 * m * (2 * e - 1), sy: 0, a: 0, b: 1.2 }),
    "pan-right": (e) => ({ z: 1, sx: -0.035 * m * (2 * e - 1), sy: 0, a: 0, b: 1.2 }),
    "pan-up":    (e) => ({ z: 1, sx: 0, sy: 0.035 * m * (2 * e - 1), a: 0, b: 1.2 }),
    "pan-down":  (e) => ({ z: 1, sx: 0, sy: -0.035 * m * (2 * e - 1), a: 0, b: 1.2 }),
    "drift":     (e) => ({ z: 1 + 0.04 * m * e, sx: 0.025 * m * (2 * e - 1), sy: 0, a: 0.05 * m * e, b: 1.2 }),
  };
  const move = MOVES[P.move] || MOVES["push-in"];
  const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t / D)));
  const camAt = (t) => move(ease(t));

  // Layers mode: plate is the far plane (d = 0), the cutout the near one (d = 1), far plane fixed (f = 0).
  const focus = P.mode === "depth" ? P.focus : 0;
  const coverage = P.mode === "depth" ? [0, 1] : [0];  // depths that must always fill the frame

  function load(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => img.decode().then(() => resolve(img), () => resolve(img));
      img.onerror = () => reject(new Error("parallax: cannot load " + src));
      img.src = src;
    });
  }

  let geo = null;      // cover fit + overscan, computed once the images are in
  let drawFrame = null;

  function geometry(iw, ih) {
    const base = Math.max(W / iw, H / ih);  // output px per source px at zoom 1 (cover fit)
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const cx = clamp(P.center[0] * iw, W / (2 * base), iw - W / (2 * base));
    const cy = clamp(P.center[1] * ih, H / (2 * base), ih - H / (2 * base));
    // Smallest extra zoom that keeps every edge covered for the whole move.
    let zx = 1;
    for (let i = 0; i <= 60; i++) {
      const c = move(i / 60);
      for (const d of coverage) {
        const k = d - focus;
        const s = base * c.z * (1 + c.a * k);
        const shx = c.sx * (1 + c.b * k) * SHORT, shy = c.sy * (1 + c.b * k) * SHORT;
        zx = Math.max(zx, (W / 2 + shx) / (s * cx), (W / 2 - shx) / (s * (iw - cx)),
                          (H / 2 + shy) / (s * cy), (H / 2 - shy) / (s * (ih - cy)));
      }
    }
    return { iw, ih, base: base * zx * 1.002, cx, cy };
  }

  function setup2d(layers) {
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    return (t) => {
      const c = camAt(t);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      for (const [img, d] of layers) {
        const k = d - focus;
        const s = geo.base * c.z * (1 + c.a * k);
        const ox = W / 2 + c.sx * (1 + c.b * k) * SHORT - geo.cx * s;
        const oy = H / 2 + c.sy * (1 + c.b * k) * SHORT - geo.cy * s;
        ctx.setTransform(s, 0, 0, s, ox, oy);
        ctx.drawImage(img, 0, 0);
      }
    };
  }

  function setupDepth(img, depth) {
    const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
    if (!gl) return null;
    const vs = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
    const fs = `precision highp float;
      uniform sampler2D uImg, uDepth;
      uniform vec2 uRes, uImgSize, uCenter, uShift;
      uniform float uScale, uA, uB, uF;
      void main() {
        vec2 o = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
        float d = uF;
        vec2 s = uCenter;
        // Find the source pixel whose own depth maps it here (damped fixed-point iteration).
        for (int i = 0; i < 14; i++) {
          float k = d - uF;
          s = uCenter + ((o - 0.5 * uRes) - uShift * (1.0 + uB * k)) / (uScale * (1.0 + uA * k));
          d = mix(d, texture2D(uDepth, s / uImgSize).r, 0.6);
        }
        gl_FragColor = vec4(texture2D(uImg, s / uImgSize).rgb, 1.0);
      }`;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const tex = (unit, image) => {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    };
    tex(0, img);
    tex(1, depth);
    const u = (n) => gl.getUniformLocation(prog, n);
    gl.uniform1i(u("uImg"), 0);
    gl.uniform1i(u("uDepth"), 1);
    gl.uniform2f(u("uRes"), W, H);
    gl.uniform2f(u("uImgSize"), geo.iw, geo.ih);
    gl.uniform2f(u("uCenter"), geo.cx, geo.cy);
    gl.uniform1f(u("uF"), focus);
    gl.viewport(0, 0, W, H);
    return (t) => {
      const c = camAt(t);
      gl.uniform1f(u("uScale"), geo.base * c.z);
      gl.uniform2f(u("uShift"), c.sx * SHORT, c.sy * SHORT);
      gl.uniform1f(u("uA"), c.a);
      gl.uniform1f(u("uB"), c.b);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    };
  }

  const files = P.mode === "depth" ? [P.files.image, P.files.depth] : [P.files.plate, P.files.cut];
  const ready = Promise.all(files.map(load)).then(([a, b]) => {
    geo = geometry(a.naturalWidth, a.naturalHeight);
    if (P.mode === "depth") {
      drawFrame = setupDepth(a, b);
      if (!drawFrame) {
        console.warn("parallax: WebGL unavailable, drawing a flat camera move");
        drawFrame = setup2d([[a, focus]]);
      }
    } else {
      drawFrame = setup2d([[a, 0], [b, 1]]);
    }
    drawFrame(0);
  });

  window.__hf = window.__hf || {};
  window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady["parallax"] = ready;
  window.addEventListener("hf-seek", (e) => {
    const t = e.detail.time;
    if (drawFrame) drawFrame(t);
    else e.detail.waitUntil(ready.then(() => drawFrame(t)));
  });

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => drawFrame && drawFrame(clock.t) }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["parallax"] = tl;
})();
</script>
</body>
</html>
