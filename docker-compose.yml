# Media toolbox: one gateway (dashboard + REST + MCP) in front of one worker per tool.
#
#   docker compose pull && docker compose up -d   start everything from prebuilt images (ghcr.io)
#   docker compose up -d --build                    or build the images yourself
#   docker compose build whisperx                   rebuild one tool
#   docker compose up -d whisperx                   restart one tool
#   docker compose logs -f gateway                  follow one service's log
#
# Settings come from .env next to this file. The GPU workers (whisperx, stable-audio, tts, vision) are in
# the "gpu" profile, on by default via COMPOSE_PROFILES=gpu in .env. Without an NVIDIA GPU, leave
# COMPOSE_PROFILES empty: ffmpeg, HyperFrames renders and Shorts still work.
# FLUX image generation (comfyui + its image worker) is the separate "flux" profile, because its models are ~11 GB:
# COMPOSE_PROFILES=gpu,flux turns it on.

x-host-mounts: &host-mounts
  # Your user folder, read-write: inputs are read from it and outputs written back.
  # The gateway refuses to write into PROTECTED_DIRS (e.g. your raw recordings).
  - ${HOST_HOME:?copy .env.example to .env and set HOST_HOME}:/host
  # Small caches that don't belong in your user folder (nltk data, npm, etc.).
  - toolbox-cache:/cache

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, utility, compute]

x-worker-env: &worker-env
  # Model weights live in your normal Hugging Face / torch caches, so they are
  # downloaded once and shared with anything else on the machine.
  HF_HOME: /host/.cache/huggingface
  TORCH_HOME: /host/.cache/torch
  NLTK_DATA: /cache/nltk_data
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  PYTHONUNBUFFERED: "1"
  TRANSCRIBE_VOCAB: ${TRANSCRIBE_VOCAB:-}

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ghcr.io/johanduran/media-toolbox-gateway:${TOOLBOX_VERSION:-latest}
    ports:
      - "127.0.0.1:${PORT}:8765"
    volumes: *host-mounts
    environment:
      HOST_HOME: ${HOST_HOME}
      OUTPUTS_DIR: ${OUTPUTS_DIR}
      SFX_LIBRARY: ${SFX_LIBRARY}
      PROTECTED_DIRS: ${PROTECTED_DIRS}
      SHORTS_ROOT: ${SHORTS_ROOT:-${HOST_HOME}/Documents/Projects}
      TRANSCRIBE_VOCAB: ${TRANSCRIBE_VOCAB:-}
      PUBLIC_URL: http://localhost:${PORT}
      DB_PATH: /cache/gateway/jobs.sqlite
      PYTHONUNBUFFERED: "1"
    # No GPU here: the dashboard's GPU figures come from a running GPU worker.
    restart: unless-stopped
    depends_on: [render]

  whisperx:
    build:
      context: workers
      dockerfile: Dockerfile.gpu
      target: whisperx
    image: ghcr.io/johanduran/media-toolbox-whisperx:${TOOLBOX_VERSION:-latest}
    profiles: [gpu]
    volumes: *host-mounts
    environment:
      <<: *worker-env
      # WhisperX models are public; an expired saved token makes downloads fail with 401.
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    <<: *gpu
    restart: unless-stopped

  stable-audio:
    build:
      context: workers
      dockerfile: Dockerfile.gpu
      target: stable-audio
    image: ghcr.io/johanduran/media-toolbox-stable-audio:${TOOLBOX_VERSION:-latest}
    profiles: [gpu]
    volumes: *host-mounts
    # Stable Audio Open is gated: it uses the token saved in HF_HOME by `hf auth login`.
    environment: *worker-env
    <<: *gpu
    restart: unless-stopped

  tts:
    build:
      context: workers
      dockerfile: Dockerfile.gpu
      target: tts
    image: ghcr.io/johanduran/media-toolbox-tts:${TOOLBOX_VERSION:-latest}
    profiles: [gpu]
    volumes: *host-mounts
    environment: *worker-env
    <<: *gpu
    restart: unless-stopped

  vision:
    build:
      context: workers
      dockerfile: Dockerfile.gpu
      target: vision
    image: ghcr.io/johanduran/media-toolbox-vision:${TOOLBOX_VERSION:-latest}
    profiles: [gpu]
    volumes: *host-mounts
    environment:
      <<: *worker-env
      # Both models are public; an expired saved token makes downloads fail with 401.
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    <<: *gpu
    restart: unless-stopped

  render:
    build:
      context: workers
      dockerfile: Dockerfile.render
    image: ghcr.io/johanduran/media-toolbox-render:${TOOLBOX_VERSION:-latest}
    volumes:
      - ${HOST_HOME:?copy .env.example to .env and set HOST_HOME}:/host
      - toolbox-cache:/cache
      # Your Windows fonts, read-only, for Shorts graphics (Segoe UI etc. can't be shipped in the image).
      - ${WINDOWS_FONTS:-C:/Windows/Fonts}:/fonts:ro
    environment:
      FONTS_DIR: /fonts
      PYTHONUNBUFFERED: "1"
      DO_NOT_TRACK: "1"
      HYPERFRAMES_TELEMETRY_DISABLED: "1"
    shm_size: "2gb"   # Chrome needs more than Docker's 64 MB default
    restart: unless-stopped

  # --- FLUX image generation ("flux" profile) ------------------------------------------------------------

  # One-shot: downloads FLUX.1 [dev] GGUF, its text encoders and VAE, and the Turbo LoRA (~11.5 GB) into the
  # comfyui_models volume, then exits. Files already there are skipped, so restarts are instant.
  comfyui-models:
    image: curlimages/curl:8.11.1
    profiles: [flux]
    user: root
    volumes:
      - comfyui-models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        HF=https://huggingface.co
        get() {
          mkdir -p "/models/$$1"
          if [ -s "/models/$$1/$$2" ]; then echo "have $$1/$$2"; return; fi
          echo "downloading $$1/$$2"
          curl -fL --retry 5 -C - -o "/models/$$1/$$2.part" "$$3"
          mv "/models/$$1/$$2.part" "/models/$$1/$$2"
        }
        get unet flux1-dev-Q4_K_S.gguf $$HF/city96/FLUX.1-dev-gguf/resolve/main/flux1-dev-Q4_K_S.gguf
        get text_encoders t5-v1_1-xxl-encoder-Q5_K_M.gguf $$HF/city96/t5-v1_1-xxl-encoder-gguf/resolve/main/t5-v1_1-xxl-encoder-Q5_K_M.gguf
        get text_encoders clip_l.safetensors $$HF/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors
        get vae ae.safetensors $$HF/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/vae/ae.safetensors
        get loras flux1-turbo-alpha.safetensors $$HF/alimama-creative/FLUX.1-Turbo-Alpha/resolve/7b29bf041b413949089d78b826a5c9726e3c8e50/diffusion_pytorch_model.safetensors
        echo "all FLUX models present"
    restart: "no"

  comfyui:
    build:
      context: workers
      dockerfile: Dockerfile.gpu
      target: comfyui
    image: ghcr.io/johanduran/media-toolbox-comfyui:${TOOLBOX_VERSION:-latest}
    profiles: [flux]
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"   # ComfyUI's own web UI, for your experiments
    volumes:
      - comfyui-models:/opt/ComfyUI/models
    environment:
      COMFYUI_ARGS: ${COMFYUI_ARGS:-}
      PYTHONUNBUFFERED: "1"
    depends_on:
      comfyui-models:
        condition: service_completed_successfully
    <<: *gpu
    restart: unless-stopped

  # The toolbox worker in front of ComfyUI: runs image_generate jobs through ComfyUI's API, frees its VRAM when
  # another GPU tool needs it, and reports ComfyUI as busy while you use its UI, so toolbox GPU jobs wait.
  image:
    build:
      context: workers
      dockerfile: Dockerfile.image
    image: ghcr.io/johanduran/media-toolbox-image:${TOOLBOX_VERSION:-latest}
    profiles: [flux]
    volumes: *host-mounts
    environment:
      COMFYUI_URL: http://comfyui:8188
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

volumes:
  toolbox-cache:
  # FLUX models. Named so an existing volume from a standalone ComfyUI setup is reused, not downloaded again.
  comfyui-models:
    name: comfyui_models
